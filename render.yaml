# CollabR18X on Render — single service serves both frontend + API
# This eliminates CORS issues: the browser calls /api/* on the same domain.
# Deploy: push to GitHub, then in Render Dashboard: New → Blueprint → connect repo.

databases:
  - name: collabr18x-db
    plan: free
    region: oregon

services:
  - type: web
    name: collabr18x
    runtime: python
    region: oregon
    plan: free

    # Build: install Node deps (include dev for vite), build frontend, then install Python deps
    buildCommand: |
      npm install --include=dev && VITE_BASE=/ npm run build && pip install -r requirements.txt

    startCommand: python run.py

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collabr18x-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

    healthCheckPath: /api/health
